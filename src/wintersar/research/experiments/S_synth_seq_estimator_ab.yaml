# R-15 / PERF-05 — sequential estimator (dolphin phase linking + compressed SLC) vs the
# traditional SBAS path (MintPy): A/B protocol placeholder (ADR-0064).
# The runner skips this experiment with a clear message unless `requires` are importable;
# even then it is a manual protocol (real data + external engines), not an automated run.
name: S_synth_seq_estimator_ab
kind: seq_estimator_ab
ids: [R-15, PERF-05, PERF-06]
description: >-
  A/B of the sequential estimator path (dolphin: mini-stack phase linking, compressed SLCs,
  N-1 unwrapping jobs) against the conventional SBAS path (M pair interferograms unwrapped
  independently, MintPy inversion) on the S benchmark site. Literature reports near-CRLB
  accuracy; the researcher's experience is a loss of real-world performance. The table
  below is filled only from measured bench_result.json files.
requires: [dolphin, mintpy]
factor: 1
seeds: [0]
data:
  kind: site
  site: S                       # benchmarks/sites/S.yaml (2 bursts x 30 days) + synthetic S
  ground_truth: benchmarks/sites/S_ground_truth.csv   # levelling / GNSS, plan 5.6 CSV schema
methods:
  - name: mintpy_sbas
    label: A — conventional SBAS (HyP3/ISCE2 pairs → SNAPHU → MintPy)
    params: {network: sbas, coherence_threshold: 0.7, unwrap: snaphu}
  - name: dolphin_sequential
    label: B — dolphin sequential estimator (mini-stack 10, compressed SLC)
    params: {ministack_size: 10, phase_linking: emi, unwrap: snaphu, timeseries: mintpy}
metrics: [closure_rms_rad, unwrap_error_fraction, wall_s, peak_rss_mb]
protocol: |
  1. Inputs: identical coregistered SLC stack (S site, 2 bursts x 30 days) for A and B; same
     DEM, orbits, water/layover masks (wintersar select geometry), same reference point.
  2. A (baseline): SBAS network (max temporal 48 d, max Bperp 150 m), multilook per SEL-09,
     SNAPHU per interferogram (wintersar unwrap scheduler, PERF-04), MintPy inversion with the
     template of ADR-0021. Record: number of unwrap jobs (M), wall time per stage, peak RSS.
  3. B (candidate): dolphin sequential mode (mini-stack 10, EMI, compressed SLCs), N-1 linked
     interferograms unwrapped with the same SNAPHU settings, time series through the same
     MintPy inversion so that only the phase estimation differs (plan 6.2 PERF-05/06:
     outputs normalised to the same schema by io.formats).
  4. Metrics (plan 6.3, 3 repetitions, median): closure RMS of the unwrapped stack
     (validate.closure, unw mode), unwrap-error indicators (non-zero integer closure
     fraction, tile-seam jumps), ground-truth RMSE at levelling/GNSS sites
     (validate.metrics.compare), total wall time and peak RSS per path, number of unwrap
     jobs. Write bench_result.json per path; wintersar bench --compare renders the table.
  5. Decision rule (ADR-0064): B is adopted as an option only if its ground-truth RMSE is not
     worse than A beyond the levelling sigma and closure RMS is not higher; the default path
     changes only through a separate ADR after the researcher signs off (rule 11.10).
