# diagnose module messages (en). Keys diagnose.KB-*.cause/fix are generated from
# src/wintersar/diagnose/kb/*.yaml by scripts/render_kb_docs.py --write-i18n; edit the KB, not this block.
diagnose:
  cli:
    title: Log diagnosis
    path_required: Give a log file or directory (use --list-kb to list the KB).
    path_not_found: 'Path not found: {path}'
    unknown_engine: 'Unknown engine ''{engine}''. Choose one of: {engines}'
    no_logs: 'No log files under: {path}'
    files_scanned: 'Scanned {n} log file(s) (engine: {engine})'
    kb_title: '{n} diagnosis KB entries'
    retry_hint: 'Retry hint [{rule_id}]: rerun stage ''{stage}'' with action ''{action}'', params {params}'
  report:
    title: Failure diagnosis report
    source: 'Source: `{path}`'
    evidence: Evidence
    line: line {line} · {count}x
    retry_hint: Retry hint
    retry_detail: '{rule_id}: rerun stage ''{stage}'' with action ''{action}'''
    retry_params: Parameters
    unverified: 'This pattern has not been verified against the upstream source string yet (pattern_verified: false, see docs/open-questions.md).'
    engine_mismatch: A KB entry of a different engine than the detected one ({engine}) matched. The log may be mixed or the engine detection wrong.
    generated: Report generated by wintersar diagnose. Paths and tokens are masked.
  KB-UNKNOWN:
    cause: 'The log shows error markers ({n_events}) but none matches a known failure pattern (KB). Engine: {engine}. Excerpt:

      {excerpt}'
    fix: Read the last exception / ERROR line of the excerpt and look for a similar entry in docs/kb/index.md. Once the cause is known, add an entry to src/wintersar/diagnose/kb/*.yaml and run scripts/render_kb_docs.py --write-i18n to extend the KB.
  KB-ASF-001:
    cause: The ASF/CMR search API call failed (HTTP {status}). 4xx means a bad query (invalid WKT, date format or unknown keyword); 5xx and timeouts are CMR server-side problems and usually transient. asf_search retries 5xx up to three times before raising.
    fix: '4xx: check the AOI GeoJSON/WKT and time_range and read the error text in ''wintersar search --json''. 5xx/timeout: retry after a while and check https://status.asf.alaska.edu if it persists. Split very large queries by date range.'
  KB-AUTH-001:
    cause: NASA Earthdata Login authentication failed (HTTP 401/403). The credentials in EARTHDATA_TOKEN or ~/.netrc are missing, expired or wrong, or the account has not approved ASF data access (EULA).
    fix: Check the account and token expiry at https://urs.earthdata.nasa.gov and reset EARTHDATA_TOKEN or ~/.netrc (machine urs.earthdata.nasa.gov, login/password, mode 600). 'wintersar check-install' verifies that credentials are present.
  KB-ENV-001:
    cause: 'GDAL/PROJ library versions do not match: a proj.db from a different PROJ installation is being read (PROJ_LIB/PROJ_DATA environment variable, or pip wheels mixed with conda libraries), or the shared library (libgdal/libproj) cannot be loaded.'
    fix: Reinstall rasterio, pyproj and gdal together in one environment (either conda-forge or pip wheels, not both) and unset PROJ_LIB / PROJ_DATA / GDAL_DATA variables that point to another installation. 'wintersar check-install' reports a rasterio/pyproj PROJ mismatch as ENV-004.
  KB-ENV-002:
    cause: The process ran out of memory (Linux OOM killer 'Killed', Python MemoryError, or errno ENOMEM 'Cannot allocate memory'). The data volume (pixels x pairs) exceeds the available memory or too many jobs run in parallel.
    fix: Lower the number of concurrent jobs (compute.cores) and the memory budget (compute.memory_gb), and reduce the pixel count with a larger multilook factor or a smaller AOI. For unwrapping use tile mode (KB-SNAPHU-002); for the MintPy inversion set the compute.maxMemory/numWorker template values to the machine spec (PERF-09).
  KB-HYP3-001:
    cause: 'Not enough HyP3 credits: the submitted jobs cost {cost} credits but only {remaining} remain. HyP3 Basic accounts receive 8,000 free credits per month; the cost per job depends on product type, resolution and number of bursts.'
    fix: Reduce the number of pairs (tighter temporal/perpendicular baselines in the SBAS network), use a coarser resolution (80 m / 20x4 looks is cheapest), wait for next month's allotment, or purchase additional credits through HyP3+. 'wintersar plan' shows the expected credits before submission and selection.budget_credits caps them.
  KB-HYP3-002:
    cause: 'HyP3 rejected the burst InSAR job at input validation: the reference and secondary bursts have different Full Burst IDs, their polarizations differ, or an unsupported polarization (VH/HV) was submitted. HyP3 burst InSAR only processes pairs with the same burst ID and the same polarization (VV or HH).'
    fix: 'Pair only burst products with the same Full Burst ID (e.g. 052_109903_IW2) and the same polarization (VV recommended). ''wintersar precheck'' SEL rules check track, polarization and burst consistency beforehand; keep data.polarization: VV in the config.'
  KB-HYP3-003:
    cause: HyP3 rejected the job because its DEM does not cover the requested scenes ({granules}). This occurs in polar regions and over some ocean areas.
    fix: 'Choose other scenes/bursts inside the DEM coverage or adjust the AOI. If that area must be processed, use the local ISCE2 path (engine.interferogram: isce2_topsstack) with your own DEM.'
  KB-HYP3-004:
    cause: Job submission was refused because of the HyP3 account's access-application status (not yet requested, pending review, or rejected).
    fix: Request access through HyP3 On Demand (https://hyp3-docs.asf.alaska.edu/) and wait for approval. Until then, 'wintersar plan' can still produce the estimate.
  KB-ISCE2-001:
    cause: The reference and secondary acquisitions share no common bursts. This happens when the two dates' frames (slices) cover different segments, when the bbox does not intersect the bursts of one date, or when scenes from different tracks (relative orbits) are mixed.
    fix: Keep only scenes with the same relative orbit and polarization in the stack and restrict the AOI to bursts present on every date ('wintersar precheck' SEL rules check this). In topsStack, shrink '-b/--bbox' to the area covered by all dates or drop the dates without common bursts with '-x/--exclude_dates'.
  KB-ISCE2-002:
    cause: In the ESD (Enhanced Spectral Diversity) azimuth misregistration step no burst-overlap pixel exceeds the coherence threshold (topsStack default 0.85). Overlap areas dominated by water, vegetation or snow, or very long temporal baselines, cause this.
    fix: 'Lower topsStack''s ''-e/--esd_coherence_threshold'' (e.g. 0.85 -> 0.7), shorten the temporal baseline of the pair, or rerun with geometry-only coregistration via ''-C/--coregistration geometry'' (possibly less precise). In the wintersar config, engine.esd: false skips ESD.'
  KB-ISCE2-003:
    cause: No orbit file (POEORB precise or RESORB restituted) covering the acquisition time was found in the orbit directory, or the download failed. The orbit directory is empty, the scene is too recent for a precise orbit, or authentication with the orbit server failed.
    fix: Download the orbit files in advance into topsStack's '-o/--orbit_directory' (topsStack's dloadOrbits.py / fetchOrbit.py need a Copernicus Data Space Ecosystem account). The wintersar fetch stage caches orbits under ~/.cache/wintersar (PERF-02). For recent scenes fall back to RESORB or rerun once the precise orbit is published; as a last resort unset orbitdir to use the annotation orbit (lower accuracy).
  KB-ISCE2-004:
    cause: The DEM does not cover the processing area (missing tiles, or a DEM filled with null values), or the DEM reference-system metadata that ISCE2 expects (WGS84 ellipsoid vs EGM96 geoid) is inconsistent.
    fix: 'Prepare a DEM that extends well beyond the processing bbox and pass it with topsStack ''-d/--dem''. Re-download missing tiles after Earthdata authentication (~/.netrc, machine urs.earthdata.nasa.gov), and for ISCE2 use a DEM converted to WGS84 ellipsoid heights with matching .xml metadata. Coastal / border areas may have DEM gaps: check the extent of the DEM produced by wintersar fetch.'
  KB-ISCE2-005:
    cause: topsStack found no SAFE scene that satisfies both the date range and the bbox. The bbox (SNWE order) does not overlap the scenes, the SAFE directory / date range is wrong, or every date was dropped because it does not fully cover the bbox.
    fix: Re-check '-b/--bbox' ('S N W E' order) against the scene footprints ('wintersar precheck' computes coverage_of_aoi). Shrink the bbox, or force-include dates that only partially cover it using the topsStack options.
  KB-MINTPY-001:
    cause: 'Automatic reference-point selection failed: no pixel has an average spatial coherence above {threshold} (mintpy.reference.minCoherence, default 0.85). The stack is coherent nowhere (vegetation, water, snow), the mask is too aggressive, or the interferograms themselves are bad.'
    fix: First inspect avgSpatialCoh for a stable, coherent area (urban, bare rock). If there is one, take a candidate from 'wintersar refpoint' and set mintpy.reference.lalo (or .yx) manually, or lower mintpy.reference.minCoherence (e.g. 0.85 -> 0.7). If nothing is coherent, revisit the pair selection (shorter temporal baselines, coherence threshold) first.
  KB-MINTPY-002:
    cause: After network inversion fewer pixels than the minimum ({min_num_pixel}, mintpy.networkInversion.minNumPixel) pass the temporal-coherence mask (mintpy.networkInversion.minTempCoh, default 0.7). The reference point sits in an unwrapping-error area, the network is disconnected, or pairs with many unwrapping errors are included.
    fix: 'As MintPy suggests: (1) make sure the reference point is free of unwrapping errors and (2) make sure the network is fully connected without subsets (drop low-coherence pairs with mintpy.network.minCoherence). If still short, lower mintpy.networkInversion.minTempCoh (e.g. 0.7 -> 0.6) or enable unwrap_error_correction.'
  KB-MINTPY-003:
    cause: 'Downloading the weather re-analysis data (e.g. ERA5) for tropospheric correction failed: the PyAPS CDS (Copernicus Climate Data Store) account is not configured or uses an outdated format, or all three download attempts failed for network reasons.'
    fix: Register the CDS API key in the current format as described by PyAPS (https://github.com/insarlab/PyAPS/), check network access and rerun. Pre-downloaded files placed in mintpy.troposphericDelay.weatherDir skip the download (wintersar fetch caches them, PERF-02). As a temporary workaround switch mintpy.troposphericDelay.method to height_correlation or gacos (wintersar config timeseries.troposphere).
  KB-MINTPY-004:
    cause: The manually specified reference point (mintpy.reference.yx / lalo) lies outside the data extent or inside the masked-out area.
    fix: Check the reference coordinates (lat/lon order, CRS) and move the point to a stable area inside the data extent. 'wintersar refpoint' recommends high-coherence candidates.
  KB-SNAPHU-001:
    cause: 'While assembling tiles, SNAPHU exceeded its internal limit on secondary-network nodes: the reliable regions are split too finely because TILECOSTTHRESH is too high and/or MINREGIONSIZE is too small.'
    fix: Lower TILECOSTTHRESH (e.g. default 500 -> 250) and raise MINREGIONSIZE (e.g. default 100 -> 200), then rerun unwrapping. In snaphu-py these are the tile_cost_thresh / min_region_size arguments. If the tile scratch directory (--tiledir) still exists, 'snaphu --assemble' reruns only the assembly step.
  KB-SNAPHU-002:
    cause: SNAPHU could not allocate memory (malloc failed with 'Out of memory', or a tile child process was killed by the OOM killer). Single-tile memory grows with the number of pixels, so large interferograms or too many parallel tiles trigger this.
    fix: Switch to tile mode or increase the number of tiles (--tile <nrow> <ncol> <rowovrlp> <colovrlp>; ntiles / tile_overlap in snaphu-py) and reduce the number of concurrent processes (--nproc, nproc). Masking water / low-coherence pixels or increasing the multilook factor also reduces the node count. The wintersar unwrap scheduler derives the tile count from unwrap.memory_mb_per_mpixel.
  KB-SNAPHU-003:
    cause: 'The tile parameters do not fit the input: the tiles are too small or the overlap too large to leave a valid tile interior, or MINREGIONSIZE exceeds the tile size.'
    fix: Reduce the number of tiles (NTILEROW/NTILECOL; ntiles in snaphu-py) or make the overlap (ROWOVRLP/COLOVRLP; tile_overlap) much smaller than the tile size, and keep MINREGIONSIZE (min_region_size, default 100) below the number of pixels per tile. For small interferograms a single tile (1x1) is the safe choice.
