# Golden statistics layer (plan §8 regression row, ADR-0100..0102). Diagnostics: cause → fix.
golden:
  make:
    written: "Golden statistics written: {path} ({n_bytes} bytes, {n_leaves} values)"
    unchanged: "Identical to the previous golden within tolerance ({n_leaves} values)."
    changed: "{n} values differ from the previous golden — state in the PR body whether the change is intended."
  check:
    start: "Golden check: site {site} · golden {path} · seed {seed}"
    ok: "Golden statistics match: {n_leaves} values (rtol={rtol:g}, atol={atol:g}, fraction atol={fraction_atol:g})"
    regenerate: "If the change is intended, regenerate the golden with '.venv/bin/python scripts/make_golden.py' (inspect the differences first with '--check') and explain why in the PR body."
  GOLDEN-001:
    cause: "Golden value '{path}' differs: expected {expected}, actual {actual} (tolerance {tolerance})."
    fix: "Check whether the change to the synthetic data, the fake engine or the pipeline is intended. If so, regenerate the golden with 'python scripts/make_golden.py' and explain why in the PR body; otherwise revert the recent change."
  GOLDEN-002:
    cause: "Golden file {path} does not exist."
    fix: "Create it with 'python scripts/make_golden.py' and commit it under tests/regression/golden/."
  GOLDEN-003:
    cause: "Site definition '{path}' differs from when the golden was made: golden {expected}, current {actual}."
    fix: "If the change to benchmarks/sites/*.yaml is intended, regenerate the golden with 'python scripts/make_golden.py'; otherwise revert the site definition."
  GOLDEN-004:
    cause: "The golden pipeline run failed at stage '{stage}': {error}"
    fix: "First confirm the fake-engine path with 'pytest tests/integration'. Pass --workdir to keep the run directory."
  GOLDEN-005:
    cause: "Golden file {path} cannot be read: {error}"
    fix: "Restore the committed file ('git checkout -- tests/regression/golden/') or regenerate it with 'python scripts/make_golden.py' (make_golden overwrites an unreadable golden and reports this as a warning)."
  GOLDEN-006:
    cause: "Site definition {path} ({option}) cannot be read: {error}"
    fix: "Point {option} at a site YAML like benchmarks/sites/S_synthetic.yaml — a mapping with name, size, runner, stages, config and param_overrides (see benchmarks/README.md)."
  GOLDEN-007:
    cause: "Golden file {path} could not be written: {error}"
    fix: "Check that the output directory is writable. A file over the size limit means arrays instead of statistics went into the golden (ADR-0100); keep golden_stats to scalar statistics."
  mismatch:
    line: "{path}: {kind} expected={expected} actual={actual}"
    line_float: "{path}: {kind} expected={expected} actual={actual} ({tolerance})"
    more: "... {n} more"
  args:
    check_description: "Run the synthetic site through the fake-engine pipeline and compare its statistics with the stored golden (ADR-0100..0102). Exit 0 = match, 1 = mismatch / golden missing or unreadable / run failed, 2 = bad input."
    make_description: "Regenerate the golden statistics of a synthetic site and list what changed against the previous golden (exit 0), or with --check compare only (exit 1 on a mismatch). Regenerate only after a reviewed, intended change (rule 11.4)."
    site: "site YAML (default: {default})"
    golden: "golden stats.json to compare with (default: {default}/<site>/stats.json)"
    out: "golden stats.json to write (default: {default}/<site>/stats.json)"
    workdir: "keep the pipeline run directory here (default: a temporary directory that is deleted)"
    seed: "interferogram seed when the site does not fix one (default: {default})"
    rtol: "relative tolerance for floats, ADR-0102 (default: {default:g})"
    atol: "absolute tolerance for floats (default: {default:g})"
    fraction_atol: "absolute tolerance for *_fraction values (default: {default:g})"
    lang: "message language (default: WINTERSAR_LANG or ko)"
    json: "print a JSON envelope on stdout instead of text (also on error paths)"
    markdown: "also write the findings as a Markdown table to this file"
    check: "do not write; compare with the stored golden and exit 1 on a mismatch"
