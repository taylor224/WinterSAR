# QGIS plugin strings (namespace qgis.*). The plugin cannot import wintersar inside the QGIS
# Python, so build_zip.py copies this file (flattened, merged with en.yaml) into the plugin as
# i18n/en.json; in a checkout the plugin reads this YAML directly. Diagnostics: cause -> fix.
qgis:
  plugin:
    name: "wintersar"
    dock_title: "wintersar InSAR"
    menu_open: "Open the wintersar panel"
    provider_name: "wintersar (Sentinel-1 InSAR)"
    group: "wintersar"
  env:
    title: "Environment"
    python_exe: "Python executable"
    env_hint: "Environment hint"
    env_hint_help: "conda:<env name or prefix> | pixi:<manifest dir> | uv:<project dir> | venv:<dir>"
    lang: "Message language"
    timeout: "Timeout (s)"
    save: "Save settings"
    check_install: "Check install"
    resolved: "CLI command: {command}"
    not_resolved: "wintersar CLI not found — set the Python executable or an environment hint."
    candidates: "Detected environments"
    saved: "Settings saved: {path}"
  error:
    CLI_NOT_FOUND:
      cause: "The wintersar CLI could not be started: {detail}"
      fix: "In the Environment box choose the Python executable of the environment where wintersar is installed (pip install wintersar), or an environment hint such as conda:wintersar."
    TIMEOUT:
      cause: "'{command}' did not finish within {timeout_s:.0f} s."
      fix: "Raise the timeout in the settings, or start long stages from a terminal with 'wintersar run' and reload the results here."
    INVALID_JSON:
      cause: "'{command}' returned no JSON envelope (exit code {exit_code})."
      fix: "Run the same command in a terminal with --json and read stderr; upgrade wintersar if the installed CLI is older than the plugin."
    CANCELLED:
      cause: "'{command}' was cancelled."
      fix: "Run it again when ready; completed stages are reused from the cache."
    CLI_ERROR:
      cause: "'{command}' failed with exit code {exit_code}."
      fix: "Read the log below; for pipeline failures run 'wintersar diagnose <workdir>/logs' (Diagnose button)."
  status:
    idle: "Idle"
    running: "Running: {command}"
    done: "Done: {command}"
    failed: "Failed: {command}"
    findings_summary: "FAIL {n_fail} · WARN {n_warn} · INFO {n_info}"
  badge:
    ok: "OK"
    warn: "WARN"
    fail: "FAIL"
  aoi:
