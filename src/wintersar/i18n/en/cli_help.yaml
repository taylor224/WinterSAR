# Command-line help texts (rule 11.6, ADR-0090) and the CLI-003+ error catalogue (ADR-0091).
#
# ``cli_help.<command>.help`` is the command description, ``cli_help.<command>.<option>`` the
# help of one option/argument, ``cli_help.common.*`` texts shared by several commands.
# Code resolves them through ``wintersar.util.clihelp.h`` (never ``t`` at import time).
# ``cli.CLI-00x`` entries extend the root ``cli:`` namespace of en.yaml (deep-merged).
cli:
  aborted: "Aborted."
  action_failed: "'{command}' failed: {error}"
  CLI-003:
    cause: "Invalid usage of '{command}': {detail}"
    fix: "Check the arguments with 'wintersar {command} --help' (global options such as --json/--lang go before the command)."
  CLI-004:
    cause: "Config file not found: {path}"
    fix: "Create one with 'wintersar init' (plan §4.4) or pass the right path to --config."
  CLI-005:
    cause: "Invalid config: {error}"
    fix: "Fix the keys named in the error; 'wintersar init' writes a commented example (plan §4.4)."
  CLI-006:
    cause: "Input file not found: {path} ({option})"
    fix: "Check the path given to {option}; the file must exist before the command runs."
  CLI-007:
    cause: "Input file cannot be read: {path} ({option}) — {error}"
    fix: "Check that {option} points to a file in the expected format (see 'wintersar {command} --help')."
  CLI-008:
    cause: "Invalid value for {option}: '{value}' (allowed: {allowed})"
    fix: "Use one of the allowed values (see 'wintersar {command} --help')."
  CLI-009:
    cause: "Input {path} ({option}) contains no records."
    fix: "Produce the file again with the upstream command (for candidates.json: 'wintersar search')."
  CLI-010:
    cause: "A component needed by '{command}' could not be loaded: {error}"
    fix: "Reinstall wintersar with its dependencies (uv sync --extra dev) and check the environment with 'wintersar check-install'."

cli_help:
  common:
