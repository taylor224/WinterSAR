# select module messages (rule 11.6). Keys must match ko/select.yaml exactly.
# Diagnostics read "cause (fail|warn|info) -> fix".
select:
  SEL-01:
    desc: "All scenes in a stack share the same relative orbit (track)"
    fail: "Stack {stack} mixes scenes from different tracks {tracks}. Sentinel-1 flies 175 tracks in a 12-day cycle and interferometry only works between acquisitions of the same track (same viewing geometry). 'Same descending orbit' is not enough: the track number must match (e.g. descending 61 and descending 134 cannot be interfered)."
    info: "The {direction} candidates are split over {n} tracks ({tracks}). Even with the same direction, different tracks cannot be interfered with each other, so pick one track per stack."
    fix: "Keep only scenes with the same track number (relative orbit). Setting data.relative_orbit in the config filters them at search time. A track mismatch is the most common reason a coregistration program aborts with 'cannot find reference/tie points'."
  SEL-02:
    desc: "All scenes in a stack share the same flight direction (ascending/descending)"
    fail: "Stack {stack} mixes ascending and descending orbits ({directions}). Ascending and descending passes look at the ground from different sides, so no interferogram can be formed."
    fix: "Fix data.orbit_direction to asc or desc, or keep only scenes of one direction. Scenes with the same track number automatically share the direction (SEL-01)."
  SEL-03:
    desc: "Acquisition mode (IW) and sub-swath set are identical on every date"
    fail: "Stack {stack} has a different mode/sub-swath layout per date (modes {modes}, sub-swaths {subswaths}). Different modes have different pixel spacing and burst structure, so coregistration is impossible."
    fix: "Keep only IW scenes with the same sub-swath layout. Burst products pin the sub-swath through the full burst ID."
  SEL-04:
    desc: "Bursts common to all dates cover the AOI (coverage)"
    fail: "Stack {stack} has no AOI-intersecting burst that exists on all {n_dates} dates. IW SLC frame boundaries shift from date to date, so scene-level overlap is not guaranteed; select at burst level instead."
    warn: "The common bursts of stack {stack} cover only {coverage:.0%} of the AOI (threshold {min_coverage:.0%}). {n_bursts_dropped} burst(s) are missing on some dates."
    fix: "Re-select at burst level. Options: (a) drop the {n_dates_dropped_alt} date(s) with missing bursts -> coverage {cov_drop_dates:.0%}; (b) drop the {n_bursts_dropped} missing burst(s) and keep every date -> coverage {cov_drop_bursts:.0%}. Shrinking the AOI or adjusting time_range are further options."
  SEL-05:
    desc: "A common co-polarised channel (VV or HH) exists"
    fail: "Stack {stack} is {polarization}. Cross-polarised (VH/HV) interferograms are not supported and have low coherence; co-polarised (VV or HH) data is required."
    fix: "Set data.polarization to VV (default over land) or HH and search again."
  SEL-06:
    desc: "Per-pair perpendicular baseline (B-perp) within max_perp_baseline_m"
    warn: "Pair {pair} has |B-perp| = {perp_m:.0f} m, above the threshold {max_perp_m:.0f} m. Long baselines turn DEM errors into residual topographic phase and reduce spatial coherence."
    info: "Perpendicular baselines of stack {stack} are not computed yet ({n_pairs} pairs). SEL-06 is evaluated again once baselines are available."
    fix: "Exclude pairs above selection.max_perp_baseline_m from the network (SBAS threshold) or use a precise DEM. If baselines are missing, fetch precise orbits (POEORB) and rerun wintersar precheck."
  SEL-07:
    desc: "Per-pair temporal baseline and season crossing"
    warn: "Pair {pair} spans {days} days, above the threshold {max_days} days. Longer intervals lose temporal coherence through surface change (vegetation, farming, snow)."
    info: "{n_pairs} pair(s) of stack {stack} (e.g. {example}) cross between the leaf-on season and the leaf-off/snow season (Nov-Mar in the northern hemisphere). Such pairs can lose coherence abruptly because of vegetation and snow."
    fix: "Adjust selection.max_temporal_baseline_days or build the network from same-season pairs. If unwrapping fails often, raise unwrap.coherence_threshold to mask low-coherence pixels."
  SEL-08:
    desc: "IPF (processor) major version differs within the stack"
    info: "Scenes of stack {stack} were processed with different IPF major versions ({versions}). Known processor issues (e.g. phase-correction differences of specific versions) are tracked in the diagnosis knowledge base (KB)."
    fix: "Usually harmless; if phase jumps appear at burst boundaries in the interferograms, consult the KB entry on IPF and try excluding those dates."
  SEL-09:
    desc: "Pixel-spacing metadata consistency and automatic looks"
    warn: "Pixel spacing of stack {stack} differs between dates (range {rg_min:.3f}-{rg_max:.3f} m, azimuth {az_min:.3f}-{az_max:.3f} m, deviation {deviation:.1%} > tolerance {tolerance:.1%}). Scenes with different processing settings may be mixed."
    info: "IW SLC pixels of stack {stack} are asymmetric: range {rg:.2f} m x azimuth {az:.2f} m (ground range {ground_rg:.2f} m at incidence {incidence:.1f} deg). This is not a defect but the IW design, and it is always the case (before multilooking the image looks squeezed along azimuth). Automatic looks for a {target:.0f} m target = range {rg_looks} x azimuth {az_looks} -> pixel {pixel_rg:.1f} x {pixel_az:.1f} m (aspect {aspect:.2f})."
    fix: "Leave engine.looks at auto to apply these values. To set them by hand, give more range looks than azimuth looks (e.g. 10x3) so the aspect ratio stays <= 1.2. If spacing differs between dates, inspect that date's metadata and exclude it."
  SEL-10:
    desc: "Burst count per date and missing lines"
    warn: "{n_dates} date(s) of stack {stack} ({dates}) have a burst count different from the expected {expected} or report missing lines. Such dates leave empty bursts after coregistration or stripes in the interferogram."
    fix: "Exclude those dates from the stack (see SEL-04 for the alternative coverage) or download them again. If a download was truncated, rerunning wintersar fetch only re-downloads the incomplete files."
  SEL-11:
    desc: "Precise orbit (POEORB) availability"
    info: "{n_dates} date(s) of stack {stack} ({dates}) have no precise orbit (POEORB) yet. Precise orbits are published some days after acquisition; until then restituted orbits (RESORB) are used, and lower orbit accuracy can leave a larger residual orbital ramp."
    fix: "Wait for the precise orbits or proceed with RESORB and remove the ramp with timeseries.deramp. Missing orbit files are a common cause of coregistration aborts, so the fetch stage verifies the files exist."
  SEL-12:
    desc: "DEM-based layover and shadow fraction"
    warn: "On the {direction} orbit, layover {layover:.1%} + shadow {shadow:.1%} = {total:.1%} of the AOI exceeds the threshold {max_fraction:.0%}. When a slope facing the radar is steeper than the incidence angle, the summit echoes back before the foot and the order is reversed (layover); phase in those areas is unreliable. Which slopes are distorted depends on the orbit direction (ascending/descending)."
    info: "On the {direction} orbit, layover {layover:.1%} + shadow {shadow:.1%} = {total:.1%} of the AOI (within threshold {max_fraction:.0%}). Mean foreshortening index {foreshortening:.2f}."
    fix: "Enable the layover/shadow mask (unwrap.mask.layover) to exclude those pixels from unwrapping, and prefer the orbit direction with the lower distortion fraction. If the slopes themselves are of interest, process both directions and compare."
  SEL-13:
    desc: "Credit/resource estimate within budget"
    warn: "Estimated credits {credits:.0f} exceed the budget {budget:.0f} ({n_jobs} jobs). HyP3 consumes credits per burst job."
    info: "Estimated credits {credits:.0f} ({n_jobs} jobs) are within the budget {budget_text}. Run wintersar plan for the exact estimate."
    info_unknown: "Estimated job count {n_jobs} (pairs x bursts). No credit estimate yet; run wintersar plan for the per-engine estimate."
    fix: "Reduce the number of pairs (tighter max_temporal/max_perp thresholds, sequential network) or bursts (smaller AOI), or use a local engine (isce2_topsstack)."
