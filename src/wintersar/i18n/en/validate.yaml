# validate module messages (en). Same keys as i18n/ko/validate.yaml (rule 11.6).
# Diagnostics are "cause -> fix": validate.<ID>.cause / validate.<ID>.fix.
validate:
  VAL-001:
    cause: "The ground-truth CSV {path} lacks required column(s): {columns}. The header must contain site_id, lat, lon, date, method (and up_m / east_m / north_m / elev_m / sigma_mm as needed)."
    fix: "Rename the header to the plan schema 'site_id, lat, lon, elev_m, date, up_m, east_m, north_m, method, sigma_mm' (order does not matter, names do) and rerun."
  VAL-002:
    cause: "Line {line}, column '{column}' has an invalid value '{value}' (dates are YYYY-MM-DD, coordinates are decimal degrees, displacements are decimal metres, sigma_mm >= 0)."
    fix: "Correct the cell in the CSV (use a dot as decimal separator, ISO dates, lat in [-90, 90], lon in [-180, 180]) and rerun."
  VAL-003:
    cause: "Line {line} (site {site_id}) is a levelling row but 'up_m' is empty. Levelling needs the vertical displacement in metres."
    fix: "Fill 'up_m' (metres, positive = uplift) or drop the row. Only GNSS rows may carry east_m/north_m."
  VAL-004:
    cause: "Line {line} (site {site_id}) is a GNSS row but one of east_m, north_m, up_m is empty. GNSS rows are projected to LOS with all three ENU components."
    fix: "Provide east_m, north_m and up_m (metres) for every GNSS row, or mark the row method=leveling if only the vertical component is known."
  VAL-005:
    cause: "Line {line}: unknown method '{method}'. Allowed values are 'leveling' (alias levelling, level) and 'gnss' (alias gps)."
    fix: "Set the method column to leveling or gnss."
  VAL-006:
    cause: "Ground-truth file {path} does not exist or contains no data rows."
    fix: "Check the path (validate.leveling_csv / validate.gnss.path in config.yaml or --leveling/--gnss) and that the file has a header plus at least one row."
  VAL-007:
    cause: "Line {line}, column '{column}' holds {value}, larger than {limit} m. Displacements must be metres; this looks like millimetres pasted into a metre column."
    fix: "Divide the column by 1000 (mm -> m) or check the unit of your source data, then rerun."
  VAL-008:
    cause: "Site {site_id} cannot be projected to LOS: the time series carries no {what} and none was given."
    fix: "Pass --heading/--incidence (degrees) or load a time series with geometry layers (MintPy geometryGeo.h5 incidenceAngle, HEADING attribute)."
  VAL-009:
    cause: "Site {site_id} is {distance_m} m from the nearest InSAR pixel, beyond the limit of {limit_m} m. The site lies outside the processed grid or in a masked area."
    fix: "Check the site coordinates (lat/lon order, datum) or enlarge the AOI; use --radius to widen the search radius if the pixel spacing is coarse."
  VAL-010:
    cause: "Site {site_id} has only {n} ground-truth epoch(s) within {max_gap_days} days of an InSAR date; at least two are needed to reference and compare series."
    fix: "Use --align interp to interpolate the InSAR series to the survey dates, widen --max-gap-days, or add survey epochs inside the InSAR time span."
  VAL-011:
    cause: "Time-series file {path} has an unsupported format ({suffix}). Without wintersar.io.formats only the fake-engine .npz (dates, displacement_m, velocity_m_per_yr) can be read."
    fix: "Export the time series to .npz, or install/enable the io.formats loader for MintPy timeseries.h5 (read with h5py, never import mintpy)."
  VAL-012:
    cause: "The validate stage received no 'timeseries' artifact; only the velocity map is available, so a time-series comparison is impossible."
    fix: "Run the pipeline through the timeseries/corrections stages (the fake path always produces one) or call 'wintersar validate --ts' on an exported time series."
  VAL-013:
    cause: "Validation summary: RMSE {rmse_mm} mm, bias {bias_mm} mm over {n_sites} site(s) and {n_points} aligned epochs (radius {radius_m} m)."
    fix: "Read the per-site table in the report; a large bias with small RMSE points to a reference-point offset (re-reference with 'wintersar refpoint'), a large RMSE to unwrapping/atmospheric errors (check closure and try the sweep)."
  VAL-014:
    cause: "No ground truth was given: neither a levelling CSV nor a GNSS CSV."
    fix: "Pass --leveling data/leveling.csv and/or --gnss data/gnss.csv (schema: site_id, lat, lon, elev_m, date, up_m, east_m, north_m, method, sigma_mm)."
  VAL-015:
    cause: "The sweep grid {path} is empty or invalid: {reason}."
    fix: "Write a 'grid:' mapping of dotted config keys to value lists, e.g. grid: {{unwrap.coherence_threshold: [0.3, 0.5], engine.filter.alpha: [0.4, 0.6]}}."
  VAL-016:
    cause: "Sweep point {index} ({params}) failed: {error}."
    fix: "Run 'wintersar run' with the same parameters to see the stage diagnosis; the row is kept in the table with empty metrics."
