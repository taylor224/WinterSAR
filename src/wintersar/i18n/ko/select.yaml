# select 모듈 메시지 (규칙 11.6). 키는 en/select.yaml 과 동일해야 한다.
# 진단 문구는 "원인(fail|warn|info) → 조치(fix)" 순서.
select:
  SEL-01:
    desc: "스택 안의 모든 씬이 같은 relative orbit(트랙)인지 검사"
    fail: "스택 {stack}에 서로 다른 트랙 {tracks}의 씬이 섞여 있습니다. Sentinel-1은 12일 주기에 175개 트랙을 돌며, 간섭은 같은 트랙(같은 관측 기하) 사이에서만 성립합니다. '같은 하강궤도'라는 조건만으로는 부족하고 트랙 번호가 같아야 합니다(예: 하강 61번과 하강 134번은 간섭 불가)."
    info: "{direction} 방향 후보가 {n}개 트랙({tracks})으로 나뉘어 있습니다. 같은 방향이어도 트랙이 다르면 서로 간섭할 수 없으므로 한 트랙을 골라 스택을 만들어야 합니다."
    fix: "트랙 번호(relative orbit)가 같은 씬만 남기세요. config의 data.relative_orbit 에 트랙 번호를 지정하면 검색 단계에서 자동으로 걸러집니다. 정합 프로그램이 '기준점을 못 찾음'으로 중단되는 가장 흔한 원인이 트랙 불일치입니다."
  SEL-02:
    desc: "스택 안의 모든 씬이 같은 비행 방향(상승/하강)인지 검사"
    fail: "스택 {stack}에 상승·하강 궤도가 섞여 있습니다({directions}). 상승과 하강은 관측 기하(입사 방향)가 달라 간섭도를 만들 수 없습니다."
    fix: "data.orbit_direction 을 asc 또는 desc 로 고정하거나, 같은 방향의 씬만 남기세요. 트랙 번호가 같으면 방향은 자동으로 같습니다(SEL-01)."
  SEL-03:
    desc: "촬영 모드(IW)와 sub-swath 구성이 모든 날짜에서 같은지 검사"
    fail: "스택 {stack}의 촬영 모드/sub-swath 구성이 날짜마다 다릅니다(모드 {modes}, sub-swath {subswaths}). 모드가 다르면 픽셀 간격·burst 구조가 달라 정합이 불가능합니다."
    fix: "IW 모드의 같은 sub-swath 구성만 남기세요. burst 제품을 쓰면 full burst ID 로 sub-swath 가 고정됩니다."
  SEL-04:
    desc: "모든 날짜에 공통인 burst 가 AOI 를 덮는지 검사(커버리지)"
    fail: "스택 {stack}의 모든 날짜({n_dates}일)에 공통으로 존재하는 AOI 교차 burst 가 없습니다. IW SLC 는 프레임 경계가 날짜마다 달라 씬 단위로는 겹침이 보장되지 않으므로 burst 단위로 선택해야 합니다."
    warn: "스택 {stack}의 공통 burst 가 AOI 의 {coverage:.0%}만 덮습니다(기준 {min_coverage:.0%}). 날짜별로 빠진 burst 가 {n_bursts_dropped}개 있습니다."
    fix: "burst 단위로 다시 선택하세요. 선택지: (a) burst 가 빠진 날짜 {n_dates_dropped_alt}개를 제외하면 커버리지 {cov_drop_dates:.0%}, (b) 빠진 burst {n_bursts_dropped}개를 버리고 모든 날짜를 쓰면 커버리지 {cov_drop_bursts:.0%}. AOI 를 줄이거나 기간(time_range)을 조정하는 방법도 있습니다."
  SEL-05:
    desc: "공통 동일편파(VV 또는 HH)가 있는지 검사"
    fail: "스택 {stack}의 편파가 {polarization} 입니다. 교차편파(VH/HV) 간섭도는 지원하지 않으며 코히어런스도 낮습니다. 동일편파(VV 또는 HH) 데이터가 필요합니다."
    fix: "data.polarization 을 VV(육상 기본) 또는 HH 로 지정하고 다시 검색하세요."
  SEL-06:
    desc: "쌍별 수직 기선(B⊥)이 max_perp_baseline_m 이하인지 검사"
    warn: "쌍 {pair}의 수직 기선 |B⊥| = {perp_m:.0f} m 가 임계 {max_perp_m:.0f} m 를 넘습니다. 기선이 길수록 DEM 오차가 지형 위상 잔차로 남고 공간 코히어런스가 떨어집니다."
    info: "스택 {stack}의 수직 기선을 아직 계산하지 못했습니다(쌍 {n_pairs}개). SEL-06 판정은 기선 계산 후에 다시 수행됩니다."
    fix: "selection.max_perp_baseline_m 를 넘는 쌍은 네트워크에서 제외하거나(SBAS 임계), 정밀 DEM 을 사용하세요. 기선이 없으면 정밀궤도(POEORB)를 받아 wintersar precheck 를 다시 실행하세요."
  SEL-07:
    desc: "쌍별 시간 기선과 계절 교차 검사"
    warn: "쌍 {pair}의 시간 기선 {days}일이 임계 {max_days}일을 넘습니다. 시간이 길수록 지표 변화(식생·경작·강설)로 시간적 코히어런스가 떨어집니다."
    info: "스택 {stack}의 {n_pairs}개 쌍(예: {example})이 식생기(잎 있음)와 낙엽·적설기(북반구 11~3월) 사이를 가로지릅니다. 이런 쌍은 식생·눈 때문에 코히어런스가 급격히 낮아질 수 있습니다."
    fix: "selection.max_temporal_baseline_days 를 조정하거나 계절이 같은 쌍 위주로 네트워크를 구성하세요. 언래핑 실패가 잦으면 unwrap.coherence_threshold 를 올려 저코히어런스 픽셀을 마스크하세요."
  SEL-08:
    desc: "스택 내 IPF(처리기) 메이저 버전 차이 검사"
    info: "스택 {stack}의 씬이 서로 다른 IPF 메이저 버전({versions})으로 처리되었습니다. 알려진 처리기 이슈(예: 특정 버전의 위상 보정 차이)는 진단 지식베이스(KB)에서 관리합니다."
    fix: "대부분 문제 없으나, 간섭도에 burst 경계 위상 점프가 보이면 KB 의 IPF 항목을 확인하고 해당 날짜를 제외해 보세요."
  SEL-09:
    desc: "픽셀 간격 메타데이터 일관성 검사와 looks 자동 산출"
    warn: "스택 {stack}의 픽셀 간격이 날짜마다 다릅니다(레인지 {rg_min:.3f}~{rg_max:.3f} m, 애지머스 {az_min:.3f}~{az_max:.3f} m, 편차 {deviation:.1%} > 허용 {tolerance:.1%}). 서로 다른 처리 설정의 씬이 섞였을 수 있습니다."
    info: "스택 {stack}의 IW SLC 픽셀은 레인지 {rg:.2f} m × 애지머스 {az:.2f} m(지상 레인지 {ground_rg:.2f} m, 입사각 {incidence:.1f}°)로 비대칭입니다. 이것은 결함이 아니라 IW 모드의 설계이며 항상 그렇습니다(멀티룩 전에는 애지머스 방향이 길게 눌린 것처럼 보임). 목표 {target:.0f} m 에 맞춘 자동 looks = 레인지 {rg_looks} × 애지머스 {az_looks} → 픽셀 {pixel_rg:.1f} × {pixel_az:.1f} m (종횡비 {aspect:.2f})."
    fix: "engine.looks 를 auto 로 두면 위 값이 적용됩니다. 직접 지정하려면 종횡비가 1.2 이하가 되도록 레인지 looks 를 애지머스보다 크게(예: 10×3) 주세요. 픽셀 간격이 날짜마다 다르면 해당 날짜의 메타데이터를 확인하고 제외하세요."
  SEL-10:
    desc: "날짜별 burst 수와 라인 결손 검사"
    warn: "스택 {stack}의 {n_dates}개 날짜({dates})에서 burst 수가 기대값 {expected}개와 다르거나 라인 결손이 보고되었습니다. 결손이 있는 날짜는 정합 시 그 burst 가 비거나 간섭도에 줄무늬가 생깁니다."
    fix: "해당 날짜를 스택에서 제외하거나(대안 커버리지는 SEL-04 참고) 다시 다운로드하세요. 다운로드가 잘렸다면 wintersar fetch 를 다시 실행하면 결손 파일만 받습니다."
  SEL-11:
    desc: "정밀궤도(POEORB) 가용성 검사"
    info: "스택 {stack}의 {n_dates}개 날짜({dates})는 아직 정밀궤도(POEORB)가 없습니다. 정밀궤도는 취득 후 며칠 뒤에 배포되므로 그 전에는 복원궤도(RESORB)로 처리됩니다. 궤도 정확도가 낮아지면 잔여 궤도 램프가 커질 수 있습니다."
    fix: "정밀궤도가 배포될 때까지 기다리거나 RESORB 로 진행한 뒤 timeseries.deramp 로 램프를 제거하세요. 궤도 파일 누락은 정합 중단(abort)의 흔한 원인이므로 fetch 단계에서 파일 존재를 확인합니다."
  SEL-12:
    desc: "DEM 기반 레이오버·셰도우 비율 검사"
    warn: "{direction} 궤도에서 AOI 의 레이오버 {layover:.1%} + 셰도우 {shadow:.1%} = {total:.1%}가 기준 {max_fraction:.0%}를 넘습니다. 레이더를 향한 사면 경사가 입사각보다 급하면 산 정상이 산기슭보다 먼저 되돌아와 순서가 뒤집히며(레이오버) 그 영역의 위상은 신뢰할 수 없습니다. 궤도 방향(상승/하강)에 따라 왜곡되는 사면이 달라집니다."
    info: "{direction} 궤도에서 AOI 의 레이오버 {layover:.1%} + 셰도우 {shadow:.1%} = {total:.1%}(기준 {max_fraction:.0%} 이내). foreshortening 지수 평균 {foreshortening:.2f}."
    fix: "레이오버·셰도우 마스크(unwrap.mask.layover)를 켜서 해당 픽셀을 언래핑에서 제외하고, 상승/하강 중 왜곡 비율이 낮은 궤도 방향을 선택하세요. 사면이 관심 대상이면 두 방향을 모두 처리해 비교합니다."
  SEL-13:
    desc: "크레딧·리소스 견적이 예산 안인지 검사"
    warn: "예상 크레딧 {credits:.0f}이 예산 {budget:.0f}을 넘습니다(작업 {n_jobs}개). HyP3 는 burst 단위 작업마다 크레딧을 소모합니다."
    info: "예상 크레딧 {credits:.0f}(작업 {n_jobs}개)은 예산 {budget_text} 안입니다. 정확한 견적은 wintersar plan 으로 확인하세요."
    info_unknown: "예상 작업 수 {n_jobs}개(쌍 × burst). 크레딧 견적은 아직 없습니다. 엔진별 견적은 wintersar plan 으로 확인하세요."
    fix: "쌍 수(max_temporal/max_perp 임계 축소, sequential 네트워크)나 burst 수(AOI 축소)를 줄이거나 로컬 엔진(isce2_topsstack)을 사용하세요."
