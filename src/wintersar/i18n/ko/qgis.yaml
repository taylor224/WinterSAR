# QGIS 플러그인 문구 (네임스페이스 qgis.*). 플러그인은 QGIS 파이썬 안에서 wintersar를 import할 수
# 없으므로 build_zip.py가 이 파일을(평탄화 + ko.yaml 병합) i18n/ko.json으로 플러그인에 복사하고,
# 체크아웃에서는 이 YAML을 직접 읽는다. 진단 문구는 원인 → 조치 순서.
qgis:
  plugin:
    name: "wintersar"
    dock_title: "wintersar InSAR"
    menu_open: "wintersar 패널 열기"
    provider_name: "wintersar (Sentinel-1 InSAR)"
    group: "wintersar"
  env:
    title: "실행 환경"
    python_exe: "Python 실행 파일"
    env_hint: "환경 힌트"
    env_hint_help: "conda:<환경 이름 또는 경로> | pixi:<매니페스트 디렉터리> | uv:<프로젝트 디렉터리> | venv:<디렉터리>"
    lang: "메시지 언어"
    timeout: "제한 시간 (초)"
    save: "설정 저장"
    check_install: "설치 점검"
    resolved: "CLI 명령: {command}"
    not_resolved: "wintersar CLI를 찾지 못했습니다 — Python 실행 파일 또는 환경 힌트를 지정하세요."
    candidates: "감지된 환경"
    saved: "설정 저장됨: {path}"
  error:
    CLI_NOT_FOUND:
      cause: "wintersar CLI를 시작하지 못했습니다: {detail}"
      fix: "실행 환경 상자에서 wintersar가 설치된 환경의 Python 실행 파일(pip install wintersar)을 고르거나 conda:wintersar 같은 환경 힌트를 입력하세요."
    TIMEOUT:
      cause: "'{command}'이(가) {timeout_s:.0f}초 안에 끝나지 않았습니다."
      fix: "설정에서 제한 시간을 늘리거나, 긴 단계는 터미널에서 'wintersar run'으로 실행한 뒤 여기서 결과를 불러오세요."
    INVALID_JSON:
      cause: "'{command}'이(가) JSON 봉투를 반환하지 않았습니다 (종료 코드 {exit_code})."
      fix: "같은 명령을 터미널에서 --json으로 실행해 stderr를 확인하고, 설치된 CLI가 플러그인보다 오래됐다면 wintersar를 업그레이드하세요."
    CANCELLED:
      cause: "'{command}' 실행이 취소되었습니다."
      fix: "필요하면 같은 설정으로 다시 실행하세요. 완료된 단계는 캐시에서 재사용됩니다."
    CLI_ERROR:
      cause: "'{command}'이(가) 종료 코드 {exit_code}로 실패했습니다."
      fix: "아래 로그를 읽고, 파이프라인 실패라면 '진단' 버튼(실패한 단계의 <workdir>/<단계>/<해시>/logs, 없으면 <workdir> 전체를 훑습니다)을 누르세요."
  status:
    idle: "대기"
    running: "실행 중: {command}"
    done: "완료: {command}"
