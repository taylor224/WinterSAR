# 명령줄 도움말 문구(규칙 11.6, ADR-0090)와 CLI-003 이후 오류 카탈로그(ADR-0091).
#
# ``cli_help.<command>.help`` 는 명령 설명, ``cli_help.<command>.<option>`` 은 옵션/인자 하나의
# 도움말, ``cli_help.common.*`` 은 여러 명령이 공유하는 문구다. 코드는
# ``wintersar.util.clihelp.h`` 로 읽는다(임포트 시점의 ``t`` 호출 금지).
# ``cli.CLI-00x`` 항목은 ko.yaml 의 루트 ``cli:`` 네임스페이스를 확장한다(깊은 병합).
cli:
  aborted: "중단되었습니다."
  action_failed: "'{command}' 명령이 실패했습니다: {error}"
  CLI-003:
    cause: "'{command}' 명령의 사용법이 잘못되었습니다: {detail}"
    fix: "'wintersar {command} --help' 로 인자를 확인하세요(--json/--lang 같은 전역 옵션은 명령 앞에 둡니다)."
  CLI-004:
    cause: "설정 파일을 찾을 수 없습니다: {path}"
    fix: "'wintersar init' 으로 설정 파일을 만들거나(플랜 §4.4) --config 에 올바른 경로를 지정하세요."
  CLI-005:
    cause: "설정 파일 오류: {error}"
    fix: "오류에 나온 키를 고치세요. 'wintersar init' 이 주석이 달린 예시 파일을 씁니다(플랜 §4.4)."
  CLI-006:
    cause: "입력 파일을 찾을 수 없습니다: {path} ({option})"
    fix: "{option} 에 지정한 경로를 확인하세요. 명령을 실행하기 전에 파일이 있어야 합니다."
  CLI-007:
    cause: "입력 파일을 읽을 수 없습니다: {path} ({option}) — {error}"
    fix: "{option} 이 올바른 형식의 파일을 가리키는지 확인하세요('wintersar {command} --help' 참고)."
  CLI-008:
    cause: "{option} 값이 잘못되었습니다: '{value}' (허용: {allowed})"
    fix: "허용된 값 중 하나를 사용하세요('wintersar {command} --help' 참고)."
  CLI-009:
    cause: "입력 {path} ({option}) 에 레코드가 없습니다."
    fix: "앞 단계 명령으로 파일을 다시 만드세요(candidates.json 은 'wintersar search')."
  CLI-010:
    cause: "'{command}' 명령에 필요한 구성 요소를 불러올 수 없습니다: {error}"
    fix: "wintersar 를 의존성과 함께 다시 설치하고(uv sync --extra dev) 'wintersar check-install' 로 환경을 확인하세요."

