# validate 모듈 메시지 (ko). i18n/en/validate.yaml 과 키가 같아야 한다 (규칙 11.6).
# 진단 문구는 "원인 → 조치": validate.<ID>.cause / validate.<ID>.fix.
validate:
  VAL-001:
    cause: "대조군 CSV {path}에 필수 열이 없습니다: {columns}. 헤더에는 site_id, lat, lon, date, method(필요 시 up_m / east_m / north_m / elev_m / sigma_mm)가 있어야 합니다."
    fix: "헤더를 플랜 스키마 'site_id, lat, lon, elev_m, date, up_m, east_m, north_m, method, sigma_mm'로 바꾸고(순서는 무관, 이름은 정확히) 다시 실행하세요."
  VAL-002:
    cause: "{line}행 '{column}' 열의 값 '{value}'이(가) 올바르지 않습니다(날짜는 YYYY-MM-DD, 좌표는 십진 도, 변위는 십진 미터, sigma_mm >= 0)."
    fix: "CSV의 해당 셀을 고치세요(소수점은 마침표, ISO 날짜, lat은 [-90, 90], lon은 [-180, 180])."
  VAL-003:
    cause: "{line}행(지점 {site_id})은 수준측량(leveling) 행인데 'up_m'이 비어 있습니다. 수준측량은 수직 변위(m)가 필요합니다."
    fix: "'up_m'(미터, 양수 = 융기)을 채우거나 행을 삭제하세요. east_m/north_m은 GNSS 행에만 씁니다."
  VAL-004:
    cause: "{line}행(지점 {site_id})은 GNSS 행인데 east_m, north_m, up_m 중 하나가 비어 있습니다. GNSS 행은 ENU 세 성분 전부로 LOS에 투영됩니다."
    fix: "모든 GNSS 행에 east_m, north_m, up_m(미터)을 채우거나, 수직 성분만 있으면 method=leveling으로 바꾸세요."
  VAL-005:
    cause: "{line}행: 알 수 없는 method '{method}'. 허용값은 'leveling'(별칭 levelling, level)과 'gnss'(별칭 gps)입니다."
    fix: "method 열을 leveling 또는 gnss로 적으세요."
  VAL-006:
    cause: "대조군 파일 {path}이(가) 없거나 데이터 행이 없습니다."
    fix: "경로(config.yaml의 validate.leveling_csv / validate.gnss.path 또는 --leveling/--gnss)와 파일에 헤더 + 1행 이상이 있는지 확인하세요."
  VAL-007:
    cause: "{line}행 '{column}' 열의 값 {value}이(가) {limit} m보다 큽니다. 변위 단위는 미터여야 하는데 밀리미터 값이 미터 열에 들어간 것으로 보입니다."
    fix: "해당 열을 1000으로 나누거나(mm → m) 원자료 단위를 확인한 뒤 다시 실행하세요."
  VAL-008:
    cause: "지점 {site_id}를 LOS로 투영할 수 없습니다: 시계열에 {what}이(가) 없고 인자로도 주어지지 않았습니다."
    fix: "--heading/--incidence(도)를 주거나 기하 레이어가 있는 시계열(MintPy geometryGeo.h5의 incidenceAngle, HEADING 속성)을 읽으세요."
  VAL-009:
    cause: "지점 {site_id}는 가장 가까운 InSAR 픽셀에서 {distance_m} m 떨어져 있어 한계 {limit_m} m를 넘습니다. 지점이 처리 격자 밖이거나 마스크된 영역입니다."
    fix: "지점 좌표(lat/lon 순서, 기준계)를 확인하거나 AOI를 넓히세요. 픽셀 간격이 크면 --radius로 탐색 반경을 키우세요."
  VAL-010:
    cause: "지점 {site_id}는 InSAR 날짜 ±{max_gap_days}일 안에 있는 대조군 시점이 {n}개뿐입니다. 기준화·비교에는 최소 2개가 필요합니다."
    fix: "--align interp로 InSAR 시계열을 측량 날짜에 보간하거나 --max-gap-days를 늘리거나 InSAR 기간 안의 측량 시점을 추가하세요."
  VAL-011:
    cause: "시계열 파일 {path}의 형식({suffix})을 지원하지 않습니다. wintersar.io.formats가 없으면 fake 엔진 .npz(dates, displacement_m, velocity_m_per_yr)만 읽을 수 있습니다."
    fix: "시계열을 .npz로 내보내거나 MintPy timeseries.h5용 io.formats 로더를 설치·활성화하세요(h5py로 읽고 mintpy는 import하지 않음)."
  VAL-012:
    cause: "validate 단계에 'timeseries' 산출물이 전달되지 않았습니다. 속도 지도만 있어 시계열 비교를 할 수 없습니다."
    fix: "파이프라인을 timeseries/corrections 단계까지 실행하거나(fake 경로는 항상 생성) 내보낸 시계열로 'wintersar validate --ts'를 실행하세요."
  VAL-013:
    cause: "검증 요약: {n_sites}개 지점, 정렬된 시점 {n_points}개(반경 {radius_m} m)에서 RMSE {rmse_mm} mm, bias {bias_mm} mm."
    fix: "리포트의 지점별 표를 보세요. RMSE는 작은데 bias가 크면 기준점 오프셋('wintersar refpoint'로 재기준화), RMSE가 크면 언래핑·대기 오차(폐합 확인 후 sweep 시도)입니다."
  VAL-014:
    cause: "대조군이 주어지지 않았습니다: 수준측량 CSV도 GNSS CSV도 없습니다."
    fix: "--leveling data/leveling.csv 및/또는 --gnss data/gnss.csv를 주세요(스키마: site_id, lat, lon, elev_m, date, up_m, east_m, north_m, method, sigma_mm)."
  VAL-015:
    cause: "스윕 그리드 {path}이(가) 비어 있거나 잘못되었습니다: {reason}."
    fix: "'grid:' 아래에 점 표기 설정 키 → 값 목록을 적으세요. 예: grid: {{unwrap.coherence_threshold: [0.3, 0.5], engine.filter.alpha: [0.4, 0.6]}}."
  VAL-016:
    cause: "스윕 조합 {index}({params}) 실행이 실패했습니다: {error}."
    fix: "같은 파라미터로 'wintersar run'을 실행해 단계 진단을 확인하세요. 해당 행은 지표가 빈 채로 표에 남습니다."
  VAL-017:
    cause: "GNSS {n_samples}개 시점을 실측이 아닌 기본 heading {heading_deg}도로 LOS에 투영했습니다. 이 값은 설정의 data.orbit_direction에서 온 중위도 근사(상승 -12도 / 하강 192도)로 실제 궤도와 1~3도 차이가 납니다(docs/open-questions.md #13)."
    fix: "동서·남북 성분이 중요하면 실제 heading을 주세요: 'wintersar validate --heading <도>' 또는 HEADING 속성이 있는 시계열(MintPy timeseries.h5). 수준측량만 비교할 때는 heading이 필요 없습니다."
  VAL-018:
    cause: "목표 지표 {dropped}은(는) 성공한 조합 어디에도 값이 없어(예: 대조군 없이 실행한 gt_rmse) Pareto 전선 계산에서 제외했습니다. 남은 목표: {used}."
    fix: "gt_rmse가 필요하면 --leveling/--gnss(또는 config.yaml의 validate.leveling_csv)를 주고, 아니면 sweep YAML의 'objectives:'에 원하는 지표만 적으세요."
