# pipeline 모듈 메시지 (DAG·캐시·실행기·plan/run CLI). 진단 텍스트는 원인 → 조치 순서.
pipeline:
  PIPELINE-001:
    cause: "단계 '{stage}'(엔진 {engine})이(가) 실패했습니다: {error}"
    fix: "로그 {log_dir}를 확인하고 'wintersar diagnose {log_dir} --engine {kb_engine}'으로 원인을 진단한 뒤 'wintersar run --from {stage}'로 재개하세요."
    fix_auto: "로그 {log_dir}를 확인하고 'wintersar diagnose {log_dir}'로 원인을 진단한 뒤(엔진 {engine}에 대한 지식 베이스 항목이 없습니다) 'wintersar run --from {stage}'로 재개하세요."
  PIPELINE-002:
    cause: "단계 '{stage}'에 필요한 입력 '{artifact}'(생산 단계: {producer})의 캐시 결과가 없습니다."
    fix: "--from 없이 실행하거나 먼저 'wintersar run --until {producer}'로 상류 단계를 실행하세요."
    cause_no_cache: "단계 '{stage}'의 캐시 결과({artifact})가 없는데 --from이 이 단계보다 뒤에서 시작합니다."
    fix_no_cache: "--from 없이 실행하거나 먼저 'wintersar run --until {stage}'로 이 단계를 실행하세요."
  PIPELINE-003:
    cause: "단계 '{stage}'의 현재 설정과 일치하는 캐시가 없어 가장 최근 결과({node_hash}, {finished_at})를 재사용합니다 (--from)."
    fix: "상류 설정을 바꿨다면 --from 없이 실행해 해당 단계를 다시 계산하세요."
  PIPELINE-004:
    cause: "파이썬 단계 '{stage}'의 구현({module}.{function})을 불러올 수 없어 건너뜁니다."
    fix: "해당 모듈을 설치·구현하거나 이 단계를 필요로 하지 않는 경로(예: fake 엔진)를 사용하세요."
  PIPELINE-005:
    cause: "단계 '{stage}'에 지정된 엔진 '{engine}'이(가) 등록되어 있지 않습니다 (등록된 엔진: {known})."
    fix: "config.yaml의 {engine_key} 값을 등록된 엔진으로 바꾸거나 'wintersar check-install'로 설치 상태를 확인하세요."
  PIPELINE-006:
    cause: "단계 '{stage}'의 예상 메모리 {need_gb:.1f} GB가 예산 {budget_gb:.1f} GB를 초과합니다."
    fix: "compute.memory_gb를 늘리거나 unwrap.tiles·looks를 조정해 단일 작업 크기를 줄이세요. 엔진은 예산(_memory_gb) 안에서 타일링해야 합니다."
  PIPELINE-007:
    cause: "엔진 '{engine}'은(는) 단계 '{stage}'를 구현하지 않아 건너뜁니다 (지원 단계: {stages})."
    fix: "이 엔진이 해당 단계를 상위 단계에서 함께 처리한다면 정상입니다. 아니라면 config.yaml에서 다른 엔진을 선택하세요."
  PIPELINE-008:
    cause: "단계 '{stage}'는 조정된 파라미터로 재시도할 수 있습니다: {hint}"
    fix: "'wintersar run --from {stage} --set {stage}.<key>=<value>'로 제안된 값을 적용해 재실행하세요."
  PIPELINE-009:
    cause: "단계 '{stage}'가 산출물 '{artifact}'을(를) 선언했지만 경로 {path}가 존재하지 않습니다."
    fix: "엔진 로그를 확인하세요. 산출물 경로는 _out_dir 아래에 있어야 합니다."
  PIPELINE-011:
    cause: "언래핑 단계를 건너뜁니다: 간섭도 엔진 '{engine}'이(가) 언래핑 결과(unw)를 함께 산출합니다."
    fix: "로컬 SNAPHU/tophu로 다시 언래핑하려면 engine.interferogram을 isce2_topsstack으로 바꾸세요."
  PIPELINE-010:
    cause: "검증 단계를 건너뜁니다: validate.leveling_csv 또는 validate.gnss가 설정되지 않았습니다."
    fix: "대조군이 있다면 config.yaml의 validate 절에 경로를 지정하세요."
  PIPELINE-012:
    cause: "{key}에 지정된 대조군 파일이 존재하지 않습니다: {path}"
    fix: "config.yaml의 validate 절에서 경로를 수정하거나 항목을 지우세요. 그대로 두면 실행 마지막에 검증 단계가 실패합니다(VAL-006)."
  PIPELINE-013:
    cause: "다른 실행이 이 작업 디렉터리에서 이미 단계 '{stage}'를 실행 중입니다 ({node_dir})."
    fix: "해당 실행이 끝날 때까지 기다리거나 중지한 뒤 다시 시도하세요. 작업 디렉터리 하나에는 한 번에 하나의 실행만 가능합니다."
  PIPELINE-014:
    cause: "'{command}' 명령을 시작할 수 없습니다: {detail}"
    fix: "'wintersar {command} --help'로 인자를 확인하세요 (설정 파일 경로, 단계 이름, --set 형식)."
  PIPELINE-015:
    cause: "단계 '{stage}'는 증분 모드로 실행됩니다: 캐시된 쌍 {n_cached}개 재사용, 새 쌍 {n_new}개 계산."
    fix: "쌍 단위 캐시를 무시하고 전부 다시 계산하려면 'wintersar run --force {stage}'를 사용하세요."
  PIPELINE-016:
    cause: "단계 '{stage}'의 엔진 '{engine}'은(는) 쌍 단위 재사용(_pairs_done)을 지원하지 않아 전체를 다시 계산했습니다."
    fix: "정상 동작입니다. 엔진이 증분 처리에 참여하려면 ADR-0082의 계약(_pairs_done 읽기, pairs/ 매니페스트 쓰기)을 구현해야 합니다."
  PIPELINE-017:
    cause: "단계 '{stage}'의 쌍 단위 매니페스트가 있었지만 읽을 수 없어({error}) 버렸습니다. 쌍 {n_pairs}개를 모두 다시 계산합니다."
    fix: "쓰기 중단이나 외부 손상 뒤에 나타나는 정상 동작이며 이번 실행이 매니페스트를 다시 만듭니다. 반복되면 디스크와 작업 디렉터리 권한을 확인하세요."
