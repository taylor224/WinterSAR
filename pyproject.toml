[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "wintersar"
version = "0.1.0.dev0"
description = "Open-source Sentinel-1 InSAR (SBAS) toolkit: selection, precheck, pipeline, diagnosis, validation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "wintersar contributors" }]
keywords = ["InSAR", "SBAS", "Sentinel-1", "SAR", "MintPy", "ISCE2", "HyP3"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
]

# Core runtime dependencies. All of these are widely adopted (>10k monthly downloads).
# Engine packages (hyp3-sdk, sentineleof, sardem, snaphu, tophu, dolphin, mintpy, isce2)
# are deliberately NOT core dependencies: they are detected at runtime by
# `wintersar check-install` and invoked through subprocess/lazy-import adapters
# (design principle P2, licence isolation, and the dependency adoption policy).
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.6",
  "typer>=0.12",
  "pyyaml>=6.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "xarray>=2024.1",
  "zarr>=3.0",
  "h5py>=3.10",
  "rasterio>=1.3",
  "rich>=13.0",
  "psutil>=5.9",
  "jinja2>=3.1",
  "markdown>=3.5",
  "requests>=2.31",
  "asf-search>=8.0",
]

[project.optional-dependencies]
# Optional engine/client packages. Below the adoption threshold or conda-forge-only;
# install explicitly when you need the corresponding path.
hyp3 = ["hyp3-sdk>=7.0"]
orbits = ["sentineleof>=0.10"]
dem = ["sardem>=0.11"]
unwrap = ["snaphu>=0.4,<1"]
spurt = ["spurt>=0.1,<1"]
gpu = ["cupy>=13"]
plots = ["matplotlib>=3.8", "pandas>=2.1"]
dev = [
  "ruff>=0.5",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "types-PyYAML",
  "types-requests",
  "types-psutil",
  "types-Markdown",
  "pre-commit>=3.7",
  "matplotlib>=3.8",
  "pandas>=2.1",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]

[project.scripts]
wintersar = "wintersar.cli:main"

[project.urls]
Documentation = "https://github.com/wintersar/wintersar"
Source = "https://github.com/wintersar/wintersar"

[tool.hatch.build.targets.wheel]
packages = ["src/wintersar"]

[tool.hatch.build.targets.sdist]
include = ["src/wintersar", "tests", "docs", "README.md", "LICENSE"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["qgis_plugin", "docs", ".venv"]

[tool.ruff.lint]
select = [
  "E", "F", "W",     # pycodestyle / pyflakes
  "I",               # isort
  "UP",              # pyupgrade
  "B",               # bugbear
  "SIM",             # simplify
  "N",               # pep8-naming
  "ANN",             # annotations (type hints mandatory, rule 11.1)
  "RUF",
  "PTH",             # pathlib
  "T20",             # no print in library code
]
ignore = [
  "ANN401",  # Any allowed at adapter boundaries
  "E501",    # handled by formatter
  "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "T20", "N", "B011"]
"src/wintersar/cli.py" = ["T20"]
"src/wintersar/**/cli.py" = ["T20"]
"benchmarks/**" = ["T20", "ANN"]
"examples/**" = ["T20", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["wintersar", "tests"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
files = ["src/wintersar"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

# Engine adapters talk to third-party, untyped APIs (rule 11.1: boundary exception).
[[tool.mypy.overrides]]
module = ["wintersar.engines.*"]
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["asf_search.*", "hyp3_sdk.*", "rasterio.*", "shapely.*", "zarr.*", "h5py.*", "scipy.*", "psutil.*", "cupy.*", "eof.*", "sardem.*", "snaphu.*", "tophu.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --timeout=600"
markers = [
  "network: tests that need internet access / credentials (deselected by default: -m 'not network')",
  "slow: long-running tests",
  "gpu: requires CuPy + CUDA",
  "engine: requires an external engine installed (isce2, snaphu, mintpy, ...)",
]
filterwarnings = [
  "ignore::DeprecationWarning:asf_search.*",
]

[tool.coverage.run]
source = ["wintersar"]
branch = true
omit = ["*/qgis_plugin/*"]
