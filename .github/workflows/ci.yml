name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege token: no job writes to the repository (ADR-0101 applies the same to nightly.yml).
permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync
        run: uv sync --extra dev
      - name: Ruff
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Mypy
        run: uv run mypy
      # `engine`-marked tests are adapter *contract* tests driven by stubs/mocks (plan §3.3:
      # "an engine version bump must break the adapter tests first"), so they must run here;
      # only `engine_real` needs an actual engine installed.
      - name: Unit + integration (synthetic, no network)
        run: uv run pytest -m "not network and not engine_real and not gpu" --cov --cov-report=xml
      # Measurement only: the regression gate (--compare/--fail-on-regression against a
      # committed baseline) waits for open question #58 (which runner class to baseline on).
      - name: Synthetic bench S (measure + artifact; gate pending OQ #58)
        run: uv run wintersar --json bench --site benchmarks/sites/S_synthetic.yaml --out bench_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.python-version }}
          path: bench_result.json

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Sync (docs extra)
        run: uv sync --extra docs
      # --strict turns broken links / missing nav targets into failures (ADR-0112, OQ #73)
      - name: mkdocs build --strict
        run: uv run mkdocs build --strict

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t wintersar:ci .
      - name: Smoke
        run: docker run --rm wintersar:ci wintersar --json check-install
      - name: Smoke (strict, fake engine only)
        run: docker run --rm wintersar:ci wintersar --json check-install --strict --engine fake
